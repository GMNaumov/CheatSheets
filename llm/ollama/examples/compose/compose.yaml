name: ngm-llm-ollama

services:
  ollama:
    image: ollama/ollama:0.40.7
    container_name: ngm-llm-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ngm-llm-ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=1h          # Держать модель в памяти 1 час (можно увеличить)
      - OLLAMA_NUM_PARALLEL=1         # Отключить параллельную обработку (для CPU это критично)
    # Ограничения ресурсов, чтобы контейнер не "съел" всю систему
    deploy:
      resources:
        limits:
          cpus: '7.0'
          memory: 20G
        reservations:
          memory: 4G

volumes:
  ngm-llm-ollama-data:
    name: ngm-llm-ollama-data
