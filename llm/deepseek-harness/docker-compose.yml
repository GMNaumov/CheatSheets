# docker-compose для запуска DeepSeek Harness и ollama в одной среде

version: '3.8'
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - dsh-net
    
  dsh:
    # build: . Ссылаемся на Dockerfile, если он есть...
    image: ghcr.io/omdsh-dev/dsh-container:latest
    container_name: dsh
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3080"
    depends_on:
      - ollama
    environment:
      # Разрешаем доступ к DSH с localhost и любых других хостов в сети Docker
      - DSH_CONTAINER_TRUSTED_HOSTS=localhost,127.0.0.1,dsh
      # Отключаем проверку ключа для простоты локальной разработки
      # В реальной среде с доступом извне обязательно задайте ключ!
      # - DSH_CONTAINER_KEY=""
    volumes:
      - dsh-data:/home/dsh/.dsh
      - ./workspace:/home/dsh/workspace
    networks:
      - dsh-net

volumes:
  ollama-data:
  dsh-data:
    
networks:
  dsh-net:
    driver: bridge