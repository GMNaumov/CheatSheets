# Docker Compose для запуска DeepSeek Harness и Ollama в одной среде.

name: ngm-llm-deepseek-harness

services:
  ollama:
    image: ollama/ollama:0.40.7
    container_name: ngm-llm-deepseek-harness-ollama
    restart: unless-stopped
    volumes:
      - ngm-llm-deepseek-harness-ollama-data:/root/.ollama
    networks:
      - ngm-llm-deepseek-harness-net
    
  dsh:
    # У образа нет опубликованного версионного тега; latest проверен 2026-10-25.
    image: ghcr.io/omdsh-dev/dsh-container:latest
    container_name: ngm-llm-deepseek-harness-dsh
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3080"
    depends_on:
      - ollama
    environment:
      # Разрешаем доступ к DSH с localhost и из контейнера dsh.
      - DSH_CONTAINER_TRUSTED_HOSTS=localhost,127.0.0.1,dsh
      # Отключаем проверку ключа для простоты локальной разработки
      # В реальной среде с доступом извне обязательно задайте ключ!
      # - DSH_CONTAINER_KEY=""
    volumes:
      - ngm-llm-deepseek-harness-dsh-data:/home/node/.dsh
      - ngm-llm-deepseek-harness-dsh-workspace:/home/node
    networks:
      - ngm-llm-deepseek-harness-net

volumes:
  ngm-llm-deepseek-harness-ollama-data:
    name: ngm-llm-deepseek-harness-ollama-data
  ngm-llm-deepseek-harness-dsh-data:
    name: ngm-llm-deepseek-harness-dsh-data
  ngm-llm-deepseek-harness-dsh-workspace:
    name: ngm-llm-deepseek-harness-dsh-workspace

networks:
  ngm-llm-deepseek-harness-net:
    name: ngm-llm-deepseek-harness-net
    driver: bridge
