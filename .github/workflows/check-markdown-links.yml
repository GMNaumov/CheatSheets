name: Check Markdown links

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate local Markdown links
        shell: pwsh
        run: ./scripts/check-markdown-links.ps1
